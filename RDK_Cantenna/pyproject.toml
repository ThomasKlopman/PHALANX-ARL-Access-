[project]
name = "phalanx"
version = "0.4.0"
description = "PHALANX capstone radar — Phase 1: Part 1 Pasternack Cantenna kit, Part 2 USRP B210 + cans"
requires-python = ">=3.10,<3.14"   # team standard: 3.13
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyvisa>=1.14"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
gui = ["PyQt6>=6.6", "pyqtgraph>=0.13"]
py-backend = ["pyvisa-py>=0.7", "pyusb>=1.2"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "Part1_Pasternack_Kit/tests", "Part2_B210_Cantenna/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phalanx*"]
